<!DOCTYPE html>
<html lang="en">
<head>
<script src="auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reach RCS — Booking</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --accent:#1b4f6b;
  --accent-soft:#e6eef3;
  --agent-bg:#f1eef2;
  --agent-ink:#1f1c22;
  --user-bg:#1b4f6b;
  --user-ink:#fff;
  --chip-border:#1b4f6b;
  --chip-ink:#1b4f6b;
  --card-border:#e4e1e6;
  --ink:#1f1c22;
  --ink-soft:#49454f;
  --ink-mute:#79747e;
  --divider:#e6e0e9;
  --bg:#f7f5f8;
  --green:#059669;
  --green-bg:#ecfdf5;
}
body{background:var(--bg);color:var(--ink);font-family:'Inter','Roboto',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:36px 24px;flex-direction:column}

.caption{text-align:center;margin-bottom:18px;max-width:400px}
.caption .h{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.caption .s{font-size:11px;color:var(--ink-mute);margin-top:2px}
.caption a{color:var(--accent);text-decoration:none;font-weight:500}

.phone{width:400px;height:840px;border-radius:44px;padding:10px;background:#0f0d12;box-shadow:0 40px 80px rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.2);position:relative;flex-shrink:0}
.phone-screen{width:100%;height:100%;border-radius:36px;overflow:hidden;background:#fff;display:flex;flex-direction:column;position:relative}
.punch-hole{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:#0a0a0a;z-index:100}

.status-bar{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-family:'Roboto',sans-serif;flex-shrink:0}
.status-bar .time{font-size:13px;font-weight:500;color:var(--ink);letter-spacing:.2px}
.status-bar .icons{display:flex;align-items:center;gap:5px}

.app-hdr{background:#fff;padding:4px 6px 8px;border-bottom:1px solid var(--divider);display:flex;align-items:center;gap:8px;height:64px;flex-shrink:0}
.btn-icon{width:40px;height:40px;border:none;background:transparent;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.app-avatar{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.app-meta{flex:1;min-width:0;padding-left:4px}
.app-name{display:flex;align-items:center;gap:5px}
.app-name .n{font-size:16px;font-weight:600;color:var(--ink);letter-spacing:-.2px}
.app-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;display:flex;align-items:center;gap:5px;letter-spacing:-.05px}
.app-sub .dot{width:6px;height:6px;border-radius:50%;background:#00a855;display:inline-block}

.convo{flex:1;overflow-y:auto;background:#fff;padding:6px 0 10px;display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth}
.convo::-webkit-scrollbar{width:0}
.day-stamp{text-align:center;margin:10px 0 6px;font-size:11.5px;color:var(--ink-mute);font-weight:500;letter-spacing:.2px;animation:fade .3s ease}

.row{display:flex;align-items:flex-end;gap:8px;padding:0 10px;margin-top:2px;animation:slideIn .25s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.row.from-them{justify-content:flex-start}
.row.from-me{justify-content:flex-end}
.row .ava{width:28px;flex-shrink:0}
.row .ava .img{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px}
.bubble{max-width:72%;padding:9px 14px;font-size:15.5px;line-height:1.42;letter-spacing:-.1px;word-break:break-word}
.from-them .bubble{background:var(--agent-bg);color:var(--agent-ink);border-radius:18px 18px 18px 4px}
.from-me .bubble{background:var(--user-bg);color:var(--user-ink);border-radius:18px 18px 4px 18px}
.delivery{text-align:right;font-size:10.5px;color:var(--ink-mute);padding:1px 14px 0;margin-top:-1px;animation:fade .3s ease}

.typing-row{display:flex;align-items:flex-end;gap:8px;padding:0 10px;margin-top:2px;animation:fade .25s ease}
.typing-row .ava{width:28px;flex-shrink:0}
.typing-row .ava .img{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px}
.typing-bubble{background:var(--agent-bg);border-radius:18px 18px 18px 4px;padding:14px 16px;display:flex;gap:5px;align-items:center}
.t-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-mute);animation:typing 1.2s infinite}
.t-dot:nth-child(2){animation-delay:.18s}
.t-dot:nth-child(3){animation-delay:.36s}
@keyframes typing{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

.chips{display:flex;gap:8px;padding:6px 10px 2px 46px;flex-wrap:wrap;animation:fade .3s ease}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--chip-border);background:#fff;color:var(--chip-ink);font-size:13.5px;font-weight:500;font-family:'Inter','Roboto',sans-serif;cursor:pointer;white-space:nowrap;letter-spacing:-.1px;transition:all .15s ease}
.chip:hover{background:var(--accent-soft)}
.chip.tapped{background:var(--accent);color:#fff;transform:scale(.96)}

.actions{display:flex;gap:8px;padding:6px 10px 2px 46px;flex-wrap:wrap;animation:fade .3s ease}
.action{padding:7px 14px 7px 12px;border-radius:999px;border:1px solid var(--chip-border);background:#fff;color:var(--chip-ink);font-size:13.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px;letter-spacing:-.1px;transition:all .15s ease}
.action:hover{background:var(--accent-soft)}

.card-wrap{padding:4px 10px 2px 46px;animation:fade .3s ease}

/* Treatment plan card */
.plan-card{width:300px;border-radius:18px;overflow:hidden;background:#fff;border:1px solid var(--card-border);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.plan-card .header-band{padding:11px 14px;background:linear-gradient(135deg,var(--accent) 0%,#143f57 100%);color:#fff}
.plan-card .header-band .sub{font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;opacity:.85;margin-bottom:2px}
.plan-card .header-band .ttl{font-size:15.5px;font-weight:700;letter-spacing:-.2px;line-height:1.25}
.plan-card .body{padding:10px 14px 8px}
.plan-card .row-li{display:flex;justify-content:space-between;align-items:flex-start;padding:5px 0;font-size:13.5px;color:var(--ink-soft);border-bottom:1px solid var(--divider);gap:10px}
.plan-card .row-li:last-child{border-bottom:none}
.plan-card .row-li .lbl{font-weight:500;color:var(--ink-soft)}
.plan-card .row-li .val{font-weight:600;color:var(--ink);text-align:right}
.plan-card .total-row{display:flex;justify-content:space-between;padding:9px 14px;background:var(--accent-soft);border-top:1px solid var(--card-border);font-size:14px;font-weight:700;color:var(--accent)}

/* Slot card */
.slot-card{width:300px;border-radius:18px;overflow:hidden;background:#fff;border:1px solid var(--card-border)}
.slot-card .hdr{padding:12px 14px 8px}
.slot-card .hdr .sub{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--accent)}
.slot-card .hdr .ttl{font-size:15.5px;font-weight:700;color:var(--ink);margin-top:2px;letter-spacing:-.2px}
.slot-card .hdr .desc{font-size:12.5px;color:var(--ink-soft);margin-top:6px;line-height:1.45}
.slot-card .slots{display:flex;flex-direction:column;border-top:1px solid var(--divider)}
.slot{padding:12px 14px;background:transparent;border:none;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--divider);font-family:'Inter','Roboto',sans-serif;transition:background .15s ease}
.slot:first-child{border-top:none}
.slot:hover{background:var(--accent-soft)}
.slot.tapped{background:var(--accent);color:#fff}
.slot .day{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.1px}
.slot.tapped .day{color:#fff}
.slot .time{font-size:13px;color:var(--ink-soft);margin-top:1px;letter-spacing:-.05px}
.slot.tapped .time{color:rgba(255,255,255,.85)}
.slot .pick{font-size:13px;font-weight:600;color:var(--accent)}
.slot.tapped .pick{color:#fff}

/* Confirmation card */
.confirm-card{width:300px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,var(--green-bg) 0%,#d1fae5 100%);border:1px solid #a7f3d0}
.confirm-card .check{padding:14px 14px 4px;display:flex;align-items:center;gap:10px}
.confirm-card .check .ic{width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.confirm-card .check .ttl{font-size:15px;font-weight:700;color:#065f46;letter-spacing:-.1px}
.confirm-card .body{padding:8px 14px 12px}
.confirm-card .body .row-li{padding:5px 0;font-size:13px;color:#065f46;border-bottom:1px dashed rgba(6,95,70,.15);display:flex;justify-content:space-between;gap:10px}
.confirm-card .body .row-li:last-child{border-bottom:none}
.confirm-card .body .row-li .lbl{color:rgba(6,95,70,.7);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.confirm-card .body .row-li .val{color:#065f46;font-weight:700;font-size:13px;text-align:right}

.composer{padding:6px 10px 10px;background:#fff;border-top:1px solid var(--divider);flex-shrink:0}
.composer .inner{display:flex;align-items:center;gap:8px;background:#f3edf7;border-radius:28px;padding:4px 6px 4px 10px}
.composer .placeholder{flex:1;font-size:15px;color:var(--ink-mute);display:flex;align-items:center;gap:6px;padding:8px 4px;letter-spacing:-.1px}

.replay-btn{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:11px 22px;background:var(--accent);color:#fff;border:none;border-radius:999px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:none;align-items:center;gap:6px;box-shadow:0 8px 24px rgba(27,79,107,.35);z-index:10}
.replay-btn.visible{display:inline-flex;animation:fade .3s ease}

.progress{height:2px;background:#f3edf7;flex-shrink:0;position:relative}
.progress .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);transition:width .3s ease}

.skip-hint{position:fixed;top:14px;right:14px;font-size:11px;color:var(--ink-mute);font-family:'Inter',sans-serif;background:#fff;padding:6px 12px;border-radius:6px;border:1px solid var(--card-border);z-index:5}
.skip-hint kbd{font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--bg);padding:1px 5px;border-radius:3px;border:1px solid var(--card-border)}

@media (max-width:480px){
  .phone{width:100%;max-width:100vw;height:90vh}
  .skip-hint{display:none}
}
</style>
</head>
<body>

        <svg width="22" height="12" viewBox="0 0 22 12"><rect x="1" y="1" width="18" height="10" rx="2.2" stroke="#1F1C22" stroke-opacity=".5" fill="none"/><rect x="2.5" y="2.5" width="15" height="7" rx="1" fill="#1F1C22"/><rect x="19.5" y="4" width="1.5" height="4" rx=".5" fill="#1F1C22"/></svg>

<button class="replay-btn" id="replay">↻ Replay conversation</button>

<script>
const SCRIPT = [
  { kind: 'day',    t: 100,  text: 'Today · 9:41 AM' },
  { kind: 'user',   t: 400,  text: "Hi! I'd like to book my Botox follow-up." },
  { kind: 'typing', t: 900 },
  { kind: 'agent',  t: 1300, text: "Hi Sarah! Pulling up your file…" },
  { kind: 'typing', t: 1500 },
  { kind: 'agent',  t: 1700, text: "Got it. Dr. Chen saw you on April 29 — 35 units total, forehead and between the brows. You're right at the 3-month mark, so good timing for a refresh." },
  { kind: 'typing', t: 500 },
  { kind: 'agent',  t: 1300, text: "Want the same plan, or chat about something else first?" },
  { kind: 'chips',  t: 600,
    items: ['Same as last time', 'Add filler this visit', 'Talk to Dr. Chen first'],
    autoTap: 0
  },
  { kind: 'user',   t: 1700, text: 'Same as last time', delivery: true },
  { kind: 'typing', t: 800 },
  { kind: 'agent',  t: 1300, text: "Easy. Here's what I'll book:" },
  { kind: 'plan-card', t: 700,
    plan: {
      sub: 'Treatment plan',
      title: 'Botox refresh',
      rows: [
        { lbl: 'Forehead',         val: '20 units' },
        { lbl: 'Between the brows', val: '15 units' },
        { lbl: 'Provider',          val: 'Dr. Emily Chen' },
        { lbl: 'Time needed',       val: '~30 min' }
      ],
      total: { lbl: 'Total today', val: '$420 · 0% financing available' }
    }
  },
  { kind: 'typing', t: 1500 },
  { kind: 'agent',  t: 1300, text: "Here are Dr. Chen's openings this week. All times are Central." },
  { kind: 'slots',  t: 600,
    slots: [
      { day: 'Tue, May 12', time: '2:00 PM CT · Dr. Chen' },
      { day: 'Wed, May 13', time: '10:30 AM CT · Dr. Chen' },
      { day: 'Thu, May 14', time: '4:00 PM CT · Dr. Chen' }
    ],
    autoTap: 1
  },
  { kind: 'user',   t: 1700, text: 'Wednesday at 10:30 works', delivery: true },
  { kind: 'typing', t: 800 },
  { kind: 'agent',  t: 1300, text: "Booked ✓ — sending you a calendar invite now." },
  { kind: 'typing', t: 400 },
  { kind: 'confirm-card', t: 800,
    confirm: {
      ttl: 'Wed, May 13 · 10:30 AM CT',
      rows: [
        { lbl: 'Provider',  val: 'Dr. Emily Chen' },
        { lbl: 'Treatment', val: 'Botox · 35 units' },
        { lbl: 'Location',  val: 'Glow Aesthetics · Suite 204' },
        { lbl: 'Address',   val: '4400 Burnet Rd, Austin' },
        { lbl: 'Investment', val: '$420' }
      ]
    }
  },
  { kind: 'typing', t: 1500 },
  { kind: 'agent',  t: 1300, text: "A few quick reminders for the day before:" },
  { kind: 'typing', t: 400 },
  { kind: 'agent',  t: 800, text: "🌿 Skip alcohol the night before — it raises bruising risk." },
  { kind: 'agent',  t: 700, text: "💊 Avoid ibuprofen, aspirin, and fish oil for 24 hours. Tylenol is fine if you need something." },
  { kind: 'agent',  t: 700, text: "🧴 Come with a clean face if you can — it saves us 5 minutes." },
  { kind: 'typing', t: 400 },
  { kind: 'agent',  t: 1300, text: "If anything changes, just text back. See you Wednesday!" },
  { kind: 'actions', t: 600,
    items: [
      { label: 'Add to calendar', icon: 'cal' },
      { label: 'Get directions',  icon: 'pin' },
      { label: 'Call front desk', icon: 'phone' }
    ]
  },
];

// ─── Player ────────────────────────────────────────────────────────────────
const convo = document.getElementById('convo');
const progress = document.getElementById('progress');
const replayBtn = document.getElementById('replay');
let cursor = 0;
let timer = null;
let typingEl = null;

function clearTyping(){ if (typingEl) { typingEl.remove(); typingEl = null; } }
function scrollDown(){ requestAnimationFrame(() => { convo.scrollTop = convo.scrollHeight; }); }
function escHTML(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function appendHTML(html){
  const tmp = document.createElement('div'); tmp.innerHTML = html.trim();
  while (tmp.firstChild) convo.appendChild(tmp.firstChild);
  scrollDown();
}

function renderStep(step){
  switch(step.kind){
    case 'day':
      appendHTML(`<div class="day-stamp">${escHTML(step.text)}</div>`);
      break;
    case 'user':
      clearTyping();
      appendHTML(`<div class="row from-me"><div class="bubble">${escHTML(step.text)}</div></div>`);
      if (step.delivery) appendHTML(`<div class="delivery">Delivered · Read</div>`);
      break;
    case 'agent':
      clearTyping();
      appendHTML(`<div class="row from-them"><div class="ava"><div class="img">G</div></div><div class="bubble">${escHTML(step.text)}</div></div>`);
      break;
    case 'typing': {
      clearTyping();
      const el = document.createElement('div');
      el.className = 'typing-row';
      el.innerHTML = `<div class="ava"><div class="img">G</div></div><div class="typing-bubble"><span class="t-dot"></span><span class="t-dot"></span><span class="t-dot"></span></div>`;
      convo.appendChild(el); typingEl = el; scrollDown();
      break;
    }
    case 'chips': {
      const wrap = document.createElement('div');
      wrap.className = 'chips';
      wrap.innerHTML = step.items.map((c, i) => `<button class="chip" data-i="${i}">${escHTML(c)}</button>`).join('');
      convo.appendChild(wrap);
      wrap.querySelectorAll('.chip').forEach(btn => {
        btn.addEventListener('click', () => {
          if (cursor !== SCRIPT.indexOf(step) + 1) return;
          btn.classList.add('tapped');
          if (timer) { clearTimeout(timer); timer = null; }
          const next = SCRIPT[cursor];
          if (next && next.kind === 'user') next.text = step.items[parseInt(btn.dataset.i)];
          play();
        });
      });
      const nextStep = SCRIPT[cursor + 1];
      const nextDelay = nextStep ? (nextStep.t || 600) : 1500;
      setTimeout(() => {
        const t = wrap.querySelector(`[data-i="${step.autoTap}"]`);
        if (t && !t.classList.contains('tapped')) t.classList.add('tapped');
      }, Math.max(0, nextDelay - 250));
      scrollDown();
      break;
    }
    case 'slots': {
      const wrap = document.createElement('div');
      wrap.className = 'card-wrap';
      wrap.innerHTML = `
        <div class="slot-card">
          <div class="hdr">
            <div class="sub">Pick a slot</div>
            <div class="ttl">Three openings this week</div>
            <div class="desc">Each slot includes 30 min of treatment plus 10 min of pre/post-care. Reschedule any time.</div>
          </div>
          <div class="slots">
            ${step.slots.map((s, i) => `
              <button class="slot" data-i="${i}">
                <div><div class="day">${escHTML(s.day)}</div><div class="time">${escHTML(s.time)}</div></div>
                <span class="pick">Pick →</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;
      convo.appendChild(wrap);
      wrap.querySelectorAll('.slot').forEach(btn => {
        btn.addEventListener('click', () => {
          if (cursor !== SCRIPT.indexOf(step) + 1) return;
          btn.classList.add('tapped');
          if (timer) { clearTimeout(timer); timer = null; }
          const i = parseInt(btn.dataset.i);
          const next = SCRIPT[cursor];
          if (next && next.kind === 'user') next.text = step.slots[i].day + ' at ' + step.slots[i].time.split(' CT')[0] + ' works';
          play();
        });
      });
      const nextStep = SCRIPT[cursor + 1];
      const nextDelay = nextStep ? (nextStep.t || 600) : 1500;
      setTimeout(() => {
        const t = wrap.querySelector(`[data-i="${step.autoTap}"]`);
        if (t && !t.classList.contains('tapped')) t.classList.add('tapped');
      }, Math.max(0, nextDelay - 250));
      scrollDown();
      break;
    }
    case 'plan-card': {
      const p = step.plan;
      const wrap = document.createElement('div');
      wrap.className = 'card-wrap';
      wrap.innerHTML = `
        <div class="plan-card">
          <div class="header-band">
            <div class="sub">${escHTML(p.sub||'')}</div>
            <div class="ttl">${escHTML(p.title||'')}</div>
          </div>
          <div class="body">
            ${p.rows.map(r => `<div class="row-li"><span class="lbl">${escHTML(r.lbl)}</span><span class="val">${escHTML(r.val)}</span></div>`).join('')}
          </div>
          ${p.total ? `<div class="total-row"><span>${escHTML(p.total.lbl)}</span><span>${escHTML(p.total.val)}</span></div>` : ''}
        </div>
      `;
      convo.appendChild(wrap); scrollDown();
      break;
    }
    case 'confirm-card': {
      const c = step.confirm;
      const wrap = document.createElement('div');
      wrap.className = 'card-wrap';
      wrap.innerHTML = `
        <div class="confirm-card">
          <div class="check">
            <div class="ic">✓</div>
            <div class="ttl">${escHTML(c.ttl)}</div>
          </div>
          <div class="body">
            ${c.rows.map(r => `<div class="row-li"><span class="lbl">${escHTML(r.lbl)}</span><span class="val">${escHTML(r.val)}</span></div>`).join('')}
          </div>
        </div>
      `;
      convo.appendChild(wrap); scrollDown();
      break;
    }
    case 'actions': {
      const wrap = document.createElement('div');
      wrap.className = 'actions';
      wrap.innerHTML = step.items.map(a => {
        const ic = a.icon === 'cal'
          ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1b4f6b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>'
          : a.icon === 'phone'
          ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="#1b4f6b"><path d="M20 15.5c-1.25 0-2.45-.2-3.57-.57a1 1 0 00-1.02.24l-2.2 2.2a15.07 15.07 0 01-6.58-6.59l2.2-2.21a1 1 0 00.25-1.02A11.36 11.36 0 018.5 4a1 1 0 00-1-1H4a1 1 0 00-1 1 17 17 0 0017 17 1 1 0 001-1v-3.5a1 1 0 00-1-1z"/></svg>'
          : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1b4f6b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>';
        return `<button class="action">${ic}${escHTML(a.label)}</button>`;
      }).join('');
      convo.appendChild(wrap); scrollDown();
      break;
    }
  }
}

function updateProgress(){ progress.style.width = `${(cursor / SCRIPT.length) * 100}%`; }

function play(){
  updateProgress();
  if (cursor >= SCRIPT.length) {
    clearTyping();
    replayBtn.classList.add('visible');
    return;
  }
  const step = SCRIPT[cursor];
  timer = setTimeout(() => {
    renderStep(step); cursor++; play();
  }, step.t || 600);
}

function reset(){
  if (timer) clearTimeout(timer);
  clearTyping();
  convo.innerHTML = '';
  cursor = 0;
  replayBtn.classList.remove('visible');
  play();
}

replayBtn.addEventListener('click', reset);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') {
    if (timer) { clearTimeout(timer); timer = null; play(); }
  }
});

play();
</script>
</body>
</html>
